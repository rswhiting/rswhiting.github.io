# Site Info
title: Robert Whiting
tagline: 'In search of awesome'
description: 'A developer, in search of awesome.'
baseurl: ""
url: https://rswhiting.com
# Atom entry IDs were minted under the old github.io URL. Keep them stable so
# feed readers don't re-show every post as new.
feed_id_base: https://rswhiting.github.io
logo: '/public/logo.png'

# Site configurations
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
markdown: kramdown

kramdown:
  # Use GitHub flavored markdown, including triple backtick fenced code blocks
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    # Use existing pygments syntax highlighting css
    css_class: 'highlight'

excerpt_separator: "<!-- more -->"
sass:
  style: compressed
  sass_dir: _scss    
paginate: 5
paginate_path: '/blog/page:num'
permalink: pretty

version: 1.0.0

# About/contact
author:
  name: Robert Whiting
  description: A developer, in search of awesome.
  gravatar: cc0397d369b557e4fb019484838b8349 # md5 hash of your email address
  contact:
    linkedin:  https://www.linkedin.com/in/rswhiting
    github:    https://github.com/rswhiting
    # facebook:  <hide>
    twitter:   https://twitter.com/rswhiting
    #weibo:     http://weibo.com/
    #email:     http://www.google.com/recaptcha/mailhide/d?k=01I3lZFiZYng9N3QxYEtsDaQ==&c=31wAnZkuKqcG0ATAqJN8Z3ln5kkYLA9TwkGc-IbygpM=

# Navigation (2nd level links supported)
nav:
  Home:           
    - '/'
  Blog:           
    - '/blog/'
    - { Categories: '/blog/categories/' }
    - { Tags: '/blog/tags/' }
    - { 'Danny Rocket': '/danny-rocket/' }
    - { 'Death of Maurice': '/maurice/' }
  About:          
    - '/about/'
  Github Project: 
    - 'http://github.com/rswhiting'

# Where are tags and categories displayed
tag_page: '/blog/tags/'
category_page: '/blog/categories/'

